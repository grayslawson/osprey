# Optional LAN binding for a physical camera. Frigate is installed and managed
# separately by the user and is not part of this override.
services:
  osprey:
    environment:
      OSPREY_HOST: ${OSPREY_HOST:?set OSPREY_HOST}
    command: ["run", "--expected-camera-mac", "${OSPREY_CAMERA_MAC:?set OSPREY_CAMERA_MAC}"]
    ports:
      - name: camera-control
        target: 7442
        published: "7442"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
      - name: camera-snapshot
        target: 7444
        published: "7444"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
      - name: camera-ingest
        target: 7550
        published: "7550"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
      - name: onvif
        target: 8000
        published: "8000"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
      - name: rtsp
        target: 8554
        published: "8554"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
      - name: operator
        target: 8000
        published: "18001"
        host_ip: "${OSPREY_BIND:?set OSPREY_BIND}"
