# Configuration tab labels for the Osprey app.
#
# Without this file the Configuration tab shows the raw option keys.  The
# Supervisor reads translations/<language>.yaml; en.yaml is the fallback.
configuration:
  advertised_host:
    name: "Advertised host"
    description: >-
      The address of this Home Assistant host that the camera can reach. The
      camera connects to Osprey, so this has to be an address on the camera's
      network, not an internal one.
  camera_ip:
    name: "Camera IP address"
    description: >-
      The camera's IP address. Optional, and only an identity guard: Osprey
      checks that the camera it talks to is the one that was set up.
  camera_mac:
    name: "Camera MAC address"
    description: >-
      The camera's MAC address. Optional, and only an identity guard: Osprey
      checks that the camera it talks to is the one that was set up.
  camera_name:
    name: "Camera name"
    description: >-
      The name Osprey announces to the camera and shows in the operator
      console.
  announce:
    name: "Announce to the camera"
    description: >-
      Whether Osprey announces itself to the camera when it starts. Turn it
      off when the camera is managed by another controller.
  tracks:
    name: "Tracks"
    description: >-
      The camera's video tracks and their codecs, for example
      "video1:h264,video2:h265". Osprey reads them from the camera when it
      starts, so this only has to be set when the camera will not report them.
  onvif_port:
    name: "ONVIF port"
    description: >-
      The port the ONVIF service listens on. Frigate connects to this port.
  rtsp_port:
    name: "RTSP port"
    description: >-
      The port the RTSP service listens on. Frigate connects to this port.
  admin_password:
    name: "Console password"
    description: >-
      Password for the operator console on the direct port (the Web UI
      button). The sidebar panel does not need it: Home Assistant signs you in.
      Leave empty to keep the direct port locked.
network:
  8000/tcp: "Operator console (HTTP)"
