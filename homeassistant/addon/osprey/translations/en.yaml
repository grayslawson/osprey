# Configuration tab labels for the Osprey app.
#
# Without this file the Configuration tab shows the raw option keys.  The
# Supervisor reads translations/<language>.yaml; en.yaml is the fallback.
configuration:
  advertised_host:
    name: "Advertised host"
    description: >-
      This host's address on the camera's network. Osprey gives it to the
      camera and to ONVIF clients, so it cannot be an internal address.
  camera_ip:
    name: "Camera IP address"
    description: >-
      Optional. Osprey rejects a camera that connects from any other address.
  camera_mac:
    name: "Camera MAC address"
    description: >-
      Optional. Osprey rejects a camera with any other MAC address.
  camera_name:
    name: "Camera name"
    description: >-
      The controller name shown to the camera and in ONVIF discovery.
  announce:
    name: "Announce on the network"
    description: >-
      Multicast a WS-Discovery Hello so ONVIF clients find Osprey. Osprey
      answers discovery probes either way.
  tracks:
    name: "Tracks"
    description: >-
      The video tracks to arm and their codecs, for example
      "video1:h264,video2:h265". Osprey arms exactly these tracks.
  onvif_port:
    name: "ONVIF port"
    description: >-
      The port for ONVIF and the operator console. Frigate connects here.
  rtsp_port:
    name: "RTSP port"
    description: >-
      The port for RTSP streams. Frigate connects here.
network:
  8000/tcp: "Operator console (HTTP)"
