name: Osprey
version: "0.9.0b3"
slug: osprey
# A beta: it works, but expect rough edges and changes.
stage: experimental
description: Serve a UniFi PTZ camera to Frigate over ONVIF and RTSP. Not affiliated with Ubiquiti.
url: https://github.com/grayslawson/osprey
startup: services
boot: auto
# The image runs its own tini; a second init from Docker only adds a warning.
init: false
arch:
  - amd64
  - aarch64
# The Supervisor pulls <image>:<version>; a tag here makes it reject the app.
image: ghcr.io/grayslawson/{arch}-osprey-addon
host_network: true
webui: http://[HOST]:[PORT:8000]/
ingress: true
ingress_port: 8000
panel_icon: mdi:camera-control
panel_title: Osprey
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Osprey operator console (HTTP)
options:
  advertised_host: ""
  camera_ip: ""
  camera_mac: ""
  camera_name: osprey-g5-ptz
  announce: false
  tracks: video1:h264,video2:h265
  onvif_port: 8000
  rtsp_port: 8554
  admin_password: ""
schema:
  advertised_host: str
  camera_ip: str?
  camera_mac: str?
  camera_name: str
  announce: bool
  tracks: str
  onvif_port: port
  rtsp_port: port
  admin_password: password?
