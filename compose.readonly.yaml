# Optional read-only ONVIF persona for a second NVR (for example Protect).
# Frigate should continue using the primary ONVIF port from compose.yaml.
services:
  osprey:
    environment:
      OSPREY_HOST: ${OSPREY_HOST:?Set OSPREY_HOST to the host/LAN address}
    command: ["run", "--onvif-read-only-port", "8001"]
    ports:
      - "${OSPREY_BIND:-127.0.0.1}:${OSPREY_ONVIF_READ_ONLY_PORT:-8001}:8001"
