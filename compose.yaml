# Osprey development Compose: builds the image locally and bind-mounts the
# source tree. For deployments use compose.release.yaml. Frigate is external
# and is never managed here.
name: osprey
services:
  osprey:
    image: osprey:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      OSPREY_HOST: ${OSPREY_HOST:-127.0.0.1}
      OSPREY_ANNOUNCE: ${OSPREY_ANNOUNCE:-false}
    volumes:
      - type: bind
        source: ./cuckoo
        target: /opt/osprey/cuckoo
        read_only: true
      - type: bind
        source: ./pyunifiwire/src
        target: /opt/osprey/pyunifiwire/src
        read_only: true
      - osprey-state:/var/lib/osprey
    ports:
      - name: onvif
        target: 8000
        published: "${OSPREY_ONVIF_PORT:-8000}"
        host_ip: "${OSPREY_BIND:-127.0.0.1}"
      - name: rtsp
        target: 8554
        published: "${OSPREY_RTSP_PORT:-8554}"
        host_ip: "${OSPREY_BIND:-127.0.0.1}"
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: false
    stop_grace_period: 10s
volumes:
  osprey-state:
