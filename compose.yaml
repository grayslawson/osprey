# Osprey deployment Compose. Frigate is external and is never managed here.
name: osprey
services:
  osprey:
    image: osprey:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace/cuckoo
    command: ["python3", "main.py", "--host", "${OSPREY_HOST:-127.0.0.1}", "--cert", "/state/osprey.pem"]
    environment:
      PYTHONPATH: /workspace/pyunifiwire/src
    volumes:
      - type: bind
        source: ./cuckoo
        target: /workspace/cuckoo
      - type: bind
        source: ./pyunifiwire
        target: /workspace/pyunifiwire
      - osprey-state:/state
    ports:
      - name: onvif
        target: 8000
        published: "${OSPREY_ONVIF_PORT:-8000}"
        host_ip: "${OSPREY_BIND:-127.0.0.1}"
      - name: rtsp
        target: 8554
        published: "${OSPREY_RTSP_PORT:-8554}"
        host_ip: "${OSPREY_BIND:-127.0.0.1}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
volumes:
  osprey-state:
