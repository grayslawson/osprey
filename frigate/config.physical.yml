mqtt:
  enabled: false

auth:
  enabled: false

detectors:
  lab_cpu:
    type: cpu

logger:
  default: info
  logs:
    frigate.ptz.onvif: debug
    frigate.ptz.autotrack: debug

record:
  # Keep review clips from these physical tests on the local Frigate volume.
  # Motion segments are short-lived; detected-object clips remain available for
  # a week in the Frigate UI.
  enabled: true
  motion:
    days: 3
  detections:
    retain:
      days: 7

snapshots:
  enabled: true

cameras:
  g5_ptz:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://cuckoo:8554/video2
          input_args: preset-rtsp-generic
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      # 5 FPS was too sparse for a person crossing this close to the camera;
      # the physical detector has ample headroom for eight samples per second.
      fps: 8
    objects:
      track:
        - person
        - car
      filters:
        person:
          min_score: 0.4
          threshold: 0.5
        car:
          min_score: 0.4
          threshold: 0.5
    zones:
      tracking_zone:
        # Provisional inset. Replace with the driveway/road approach after the
        # first physical snapshot; Frigate discourages a full-frame zone.
        coordinates: 0.05,0.05,0.95,0.05,0.95,0.95,0.05,0.95
        objects:
          - person
          - car
    onvif:
      host: cuckoo
      port: 8000
      user: ''
      password: ''
      profile: video2
      autotracking:
        enabled: true
        # One-time physical calibration. Set false immediately after Frigate
        # writes movement_weights, or every restart will overwrite refinement.
        # Keep the measured pan/tilt timing model. The camera's zoom-calibration
        # sequence did not complete reliably, so do not rerun it on startup.
        calibrate_on_startup: false
        # Absolute zoom waits for pan/tilt to settle instead of issuing lens
        # corrections concurrently. This retains dynamic zoom while avoiding
        # the rapid relative-zoom oscillation seen in the physical test.
        zooming: absolute
        zoom_factor: 0.1
        track:
          - person
          - car
          - bird
          - cat
          - dog
        required_zones:
          - tracking_zone
        return_preset: home
        # Allow an interrupted detector track to reacquire before returning Home.
        timeout: 20

        movement_weights: 0.0, 1.0, 0.09058308601379395, 0.34325126781258525,
          0.34254540628002556, 0
version: 0.18-0
