mqtt:
  enabled: false

auth:
  enabled: false

detectors:
  lab_cpu:
    type: cpu

logger:
  default: info
  logs:
    frigate.ptz.onvif: debug
    frigate.ptz.autotrack: debug

record:
  enabled: false

snapshots:
  # Frigate only persists tracked-object rows when a clip or snapshot is kept.
  # The synthetic snapshot gives the bounded API proof a durable event to inspect.
  enabled: true

cameras:
  synthetic_g5_ptz:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://cuckoo:8554/video2
          input_args: preset-rtsp-generic
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
        - car
      filters:
        person:
          min_score: 0.4
          threshold: 0.5
        car:
          min_score: 0.4
          threshold: 0.5
    zones:
      tracking_zone:
        enabled: true
        coordinates: 0.0,0.0,1.0,0.0,1.0,1.0,0.0,1.0
        objects:
          - person
          - car
    onvif:
      host: cuckoo
      port: 8000
      user: ''
      password: ''
      profile: video2
      autotracking:
        enabled: true
        calibrate_on_startup: false
        # Relative mode sends pan, tilt, and zoom in one ONVIF RelativeMove.
        # That is the deterministic path exercised by frigate-autotrack-test.
        zooming: relative
        zoom_factor: 0.75
        track:
          - person
          - car
        required_zones:
          - tracking_zone
        return_preset: home
        timeout: 10
version: 0.18-0
