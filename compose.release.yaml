# Osprey release deployment (host networking). Frigate is external and is
# never managed here.
#
#   docker compose -f compose.release.yaml up -d
#   docker compose -f compose.release.yaml logs osprey   # prints the setup link
#
# Nothing has to be set. On first start Osprey finds this host's LAN address,
# opens the setup wizard and logs a link to it. Every variable below is an
# optional override; put overrides in a .env file next to this one (see
# .env.example).
#
# Host networking is the supported default: the camera dials Osprey on
# TCP 7442 (control, TLS), 7444 (snapshots) and 7550 (media ingest), clients use
# TCP 8000 (ONVIF + operator console) and 8554 (RTSP), WS-Discovery uses
# UDP 3702 multicast, and the wizard finds cameras with a UDP 10001 broadcast.
# Broadcast and multicast do not cross a container bridge. Restrict these ports
# to the camera/Frigate network with the host firewall.
#
# If host networking is not possible, use compose.release-bridge.yaml instead.
# Docker Desktop (macOS/Windows) cannot serve a LAN camera in either mode.
name: osprey
services:
  osprey:
    # The release this file was published with (scripts/validate-repo.sh
    # keeps it equal to VERSION). OSPREY_IMAGE overrides it, as
    # scripts/osprey-update.sh does.
    image: ${OSPREY_IMAGE:-ghcr.io/grayslawson/osprey:v0.9.0b7}
    pull_policy: missing
    network_mode: host
    environment:
      # Optional: the LAN address of THIS host as seen by the camera. Left
      # empty, the wizard detects it and asks you to confirm. Never use a
      # loopback, wildcard or container-bridge address.
      OSPREY_HOST: ${OSPREY_HOST:-}
      # Optional: restrict listeners to one local address (default all).
      OSPREY_BIND: ${OSPREY_BIND:-}
      # Empty: the wizard opens by itself on first run. "1" forces it open
      # while no host is configured; "0" never opens it.
      OSPREY_SETUP: ${OSPREY_SETUP:-}
      OSPREY_ANNOUNCE: ${OSPREY_ANNOUNCE:-true}
      # Strongly recommended: protect the operator console. Point this at a
      # mounted secret, for example via the `secrets:` block below.
      OSPREY_ADMIN_PASSWORD_FILE: ${OSPREY_ADMIN_PASSWORD_FILE:-}
    volumes:
      # Certificate, wizard config (osprey.json) and generated secrets. Keep it
      # across upgrades; back it up before major version changes.
      - osprey-state:/var/lib/osprey
    # secrets: [osprey_admin_password]   # then set
    #   OSPREY_ADMIN_PASSWORD_FILE=/run/secrets/osprey_admin_password
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The image already runs tini as PID 1.
    init: false
    stop_grace_period: 10s
  # Optional: Osprey Assist, the image-quality helper (docs/assist.md). Set
  # "assist": {"enabled": true} in osprey.json first, so Osprey makes the token,
  # then remove the leading "#" from this block and from `assist-state` below.
  # assist:
  #   image: ${OSPREY_IMAGE:-ghcr.io/grayslawson/osprey:v0.9.0b7}
  #   command: ["assist", "run"]
  #   network_mode: host
  #   environment:
  #     OSPREY_ASSIST_CONFIG: /var/lib/osprey-assist/osprey-assist.json
  #   volumes:
  #     - osprey-state:/var/lib/osprey:ro
  #     - assist-state:/var/lib/osprey-assist
  #   user: "1000:1000"
  #   restart: unless-stopped
  #   read_only: true
  #   tmpfs: [/tmp:mode=1777]
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
  #   depends_on: [osprey]
volumes:
  osprey-state:
