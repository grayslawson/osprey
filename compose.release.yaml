name: osprey
services:
  osprey:
    # Require an explicit image reference. The update helper validates that
    # references use an immutable release tag or digest.
    image: ${OSPREY_IMAGE:?Set OSPREY_IMAGE to an immutable release tag or digest}
    pull_policy: always
    working_dir: /workspace/cuckoo
    command: ["python3", "main.py", "--config", "/state/cuckoo.json", "--setup", "--cert", "/state/osprey.pem"]
    environment:
      PYTHONPATH: /workspace/pyunifiwire/src
    volumes:
      - osprey-state:/state
    # Keep camera protocols private by default. Set OSPREY_BIND explicitly to
    # the LAN address/interface used by Frigate (never 0.0.0.0 on an untrusted
    # host).
    ports:
      - "${OSPREY_BIND:-127.0.0.1}:${OSPREY_ONVIF_PORT:-8000}:8000"
      - "${OSPREY_BIND:-127.0.0.1}:${OSPREY_RTSP_PORT:-8554}:8554"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  osprey-state:
