name: publish

# Publish to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# No API token is stored anywhere: PyPI trusts this repo + workflow + environment.
# Register the matching publisher at https://pypi.org/manage/account/publishing/
#   owner: rjmotion  repo: pyunifiwire  workflow: publish.yml  environment: pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
