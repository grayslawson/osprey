name: Forgejo tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Match the idle Forgejo runner registered for this repository.
    runs-on: linux
    # This image provides CPython 3.13 and Node.js 20 for JavaScript actions.
    container:
      image: docker.io/nikolaik/python-nodejs:python3.13-nodejs20-bookworm@sha256:6994af43c16cbc6667b36a932cdb49a4f25d991279b589d898e0113f385bbffa
    steps:
      - name: Check out source
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest mypy types-paho-mqtt paho-mqtt
      - name: Run tests
        env:
          PYTHONPATH: ${{ forgejo.workspace }}/cuckoo:${{ forgejo.workspace }}/pyunifiwire/src
        run: |
          python -m pytest -q cuckoo/tests
          python -m pytest -q pyunifiwire/tests
      - name: Run type checks and compile sources
        run: |
          python -m mypy --config-file cuckoo/mypy.ini cuckoo
          (cd pyunifiwire && python -m mypy .)
          python -m compileall -q cuckoo pyunifiwire/src
      - name: Validate repository policy
        run: ./scripts/validate-repo.sh
