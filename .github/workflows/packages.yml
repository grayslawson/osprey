name: Package validation

on:
  pull_request:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate npm metadata and JavaScript
        working-directory: packaging/npm
        run: |
          npm install --ignore-scripts --package-lock=false
          node --check bin/osprey.js
          node bin/osprey.js --help
          npm pack --dry-run
      - name: Validate shell launchers
        run: shellcheck scripts/osprey scripts/osprey-doctor.sh
      - name: Validate Chocolatey manifest
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('packaging/chocolatey/osprey.nuspec')"
      - name: Validate Homebrew formula syntax
        run: ruby -c packaging/homebrew/osprey.rb
      - name: Check release versions stay aligned
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          npm_version = json.loads(Path("packaging/npm/package.json").read_text())["version"]
          nuspec = ET.parse("packaging/chocolatey/osprey.nuspec").getroot()
          namespace = "{http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd}"
          choco_version = nuspec.findtext(f"{namespace}metadata/{namespace}version")
          addon_version = next(
              line.split(":", 1)[1].strip().strip('"')
              for line in Path("homeassistant/addon/osprey/config.yaml").read_text().splitlines()
              if line.startswith("version:")
          )
          formula = Path("packaging/homebrew/osprey.rb").read_text()
          brew_version = re.search(r'^  version "([^"]+)"$', formula, re.MULTILINE).group(1)
          versions = {npm_version, choco_version, addon_version, brew_version}
          if len(versions) != 1:
              raise SystemExit(f"package versions differ: {sorted(versions)}")
          print(f"package version: {npm_version}")
          PY
