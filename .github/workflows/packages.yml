name: Package validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate shell launchers
        run: shellcheck scripts/osprey scripts/osprey-doctor.sh
      - name: Validate Homebrew formula syntax
        run: ruby -c packaging/homebrew/osprey.rb
      - name: Parse NixOS package and module
        # Parse-only check: no build and no network fetch of nixpkgs. The
        # VM test in the flake is run by a maintainer (see docs/nixos.md).
        run: |
          docker run --rm -v "$PWD:/src" -w /src nixos/nix:2.24.10 \
            sh -c 'for f in flake.nix package.nix nix/osprey.nix; do nix-instantiate --parse "$f" >/dev/null; done'
