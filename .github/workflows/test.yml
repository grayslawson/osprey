name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest mypy types-paho-mqtt paho-mqtt -e pyunifiwire
      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/cuckoo:${{ github.workspace }}/pyunifiwire/src
        run: |
          python -m pytest -q cuckoo/tests
          python -m pytest -q pyunifiwire/tests
      - name: Run type checks
        run: |
          python -m mypy --config-file cuckoo/mypy.ini cuckoo
          (cd pyunifiwire && python -m mypy .)
      - name: Compile Python sources
        run: python -m compileall -q cuckoo pyunifiwire/src
      - name: Check shell scripts
        run: |
          find . -path './.git' -prune -o -path './.specify' -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck
      - name: Validate repository policy
        run: ./scripts/validate-repo.sh
      - name: Validate Home Assistant metadata
        run: sh homeassistant/validate.sh
      - name: Validate Compose configurations
        env:
          OSPREY_HOST: 127.0.0.1
          OSPREY_BIND: 127.0.0.1
          OSPREY_CAMERA_MAC: 001122334455
          OSPREY_IMAGE: ghcr.io/grayslawson/osprey:v0.0.0
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.release.yaml config --quiet
          docker compose -f compose.yaml -f compose.readonly.yaml config --quiet
          docker compose -f compose.yaml -f compose.physical.yaml config --quiet
