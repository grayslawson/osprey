name: Release

# One tag-driven pipeline: tests -> distributions and a signed image -> PyPI ->
# GitHub Release, with the Home Assistant add-on image built last.
#
# Everything runs in this single workflow run (or in reusable workflows it
# calls). A release created with GITHUB_TOKEN does not start other workflows,
# which is why homeassistant.yml is called from here instead of listening for
# `release: published`.
#
# Publishing requires the GitHub environment `pypi` and a PyPI trusted
# publisher for project `osprey-ptz` that names this workflow file.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag against VERSION and main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$expected" ]; then
            echo "tag $TAG does not match VERSION ($expected)" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tags must point at a commit reachable from main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  distributions:
    name: Build Python distributions
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned build tools
        run: python -m pip install -r requirements-ci.txt
      - name: Build sdist and wheel
        run: |
          python -m build --outdir dist
          twine check --strict dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/osprey" --help >/dev/null
      - name: Record checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  image:
    name: Build and sign container image
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSPREY_VERSION=${{ needs.verify.outputs.version }}
            OSPREY_REVISION=${{ github.sha }}
            OSPREY_CREATED=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm "${IMAGE}@${DIGEST}" version

  pypi:
    name: Publish to PyPI
    needs: [distributions, image]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@fb13cb306901256ace3dab689990e13a5550ffaa # v1.11.0

  github-release:
    name: Create GitHub Release
    needs: [verify, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned git-cliff
        run: python -m pip install -r requirements-ci.txt git-cliff
      - name: Generate release notes
        run: git-cliff --latest --strip header --output "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* compose.release.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --title "Osprey $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  homeassistant:
    name: Home Assistant add-on
    needs: [verify, image]
    uses: ./.github/workflows/homeassistant.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
      packages: write
