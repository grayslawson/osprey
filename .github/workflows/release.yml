name: Release

# One tag-driven pipeline: tests -> distributions and a signed image -> PyPI ->
# GitHub Release, with the Home Assistant add-on image built last.
#
# Everything runs in this single workflow run (or in reusable workflows it
# calls). A release created with GITHUB_TOKEN does not start other workflows,
# which is why homeassistant.yml is called from here instead of listening for
# `release: published`.
#
# Publishing requires the GitHub environment `pypi`, a PyPI trusted
# publisher for `osprey-ptz` and an npm trusted publisher for
# `@osprey-ptz/cli`, both naming this workflow file. A failed publish fails the run.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # PEP 440 pre-releases, e.g. v0.9.0b1 (published as GitHub pre-releases).
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  # Re-publish to PyPI and npm for an existing tag:
  #   gh workflow run release.yml --ref v0.9.0b3
  # Only the build and publish jobs run; the image, GitHub Release and add-on
  # are skipped.  The ref must be the tag itself (verify enforces the pattern).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag against VERSION and main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$expected" ]; then
            echo "tag $TAG does not match VERSION ($expected)" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tags must point at a commit reachable from main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *a*|*b*|*rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  distributions:
    name: Build Python distributions
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned build tools
        run: python -m pip install -r requirements-ci.txt
      - name: Build sdist and wheel
        run: |
          python -m build --outdir dist
          twine check --strict dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/osprey" --help >/dev/null
      - name: Record checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  image:
    name: Build and sign container image
    if: github.event_name == 'push'
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # pep440 understands 0.9.0b1; pre-releases get only the full version
          # tag, and `latest` moves only for final releases.
          flavor: latest=false
          tags: |
            type=pep440,pattern={{version}}
            # v-prefixed twin: the docs and scripts/osprey-update.sh pin vX.Y.Z tags.
            # A raw tag, because pep440 patterns collapse to {{version}} for
            # pre-releases.
            type=raw,value=v${{ needs.verify.outputs.version }}
            type=pep440,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSPREY_VERSION=${{ needs.verify.outputs.version }}
            OSPREY_REVISION=${{ github.sha }}
            OSPREY_CREATED=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Smoke-test the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm "${IMAGE}@${DIGEST}" version

  pypi:
    name: Publish to PyPI
    needs: [distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@fb13cb306901256ace3dab689990e13a5550ffaa # v1.11.0
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Check the package version against the release
        working-directory: packaging/npm
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          package_version="$(python3 -c 'import json,os; print(json.load(open("package.json"))["version"])')"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "npm package version ($package_version) does not match release version ($RELEASE_VERSION)" >&2
            exit 1
          fi
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11.17.0
      - name: Publish the launcher
        working-directory: packaging/npm
        env:
          # npm 11 refuses a prerelease without a dist-tag, and `latest` must
          # stay on the newest stable release.
          DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [verify, pypi, npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned git-cliff
        run: python -m pip install -r requirements-ci.txt git-cliff
      - name: Generate release notes
        run: git-cliff --latest --strip header --output "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Build package-manager release assets
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist
      # The tagged formula cannot hold its own archive's checksum, so the
      # published one is computed from the archive the tag just created.
      # Chocolatey ships through its feed as a built .nupkg, not as a bare nuspec.
      - name: Build the Homebrew formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          scripts/sync-homebrew-tap.sh "$PWD" "$RUNNER_TEMP/tap" "$VERSION"
          cp "$RUNNER_TEMP/tap/Formula/osprey.rb" dist/osprey.rb
      - name: Record checksums for every asset
        run: |
          set -euo pipefail
          cp compose.release.yaml dist/
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Osprey $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            ${PRERELEASE:+--prerelease}

  homeassistant:
    name: Home Assistant add-on
    if: github.event_name == 'push'
    needs: [verify, image]
    uses: ./.github/workflows/homeassistant.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: write
