name: Home Assistant add-on images

# Runs from release.yml after a tagged release (a GITHUB_TOKEN-created release
# event does not start other workflows, so `release: published` never fired),
# or by hand for a rebuild.
on:
  workflow_call:
    inputs:
      version:
        description: Add-on version to build (for example, 0.1.0)
        required: true
        type: string
      prerelease:
        description: Pre-release build (does not move the "latest" tag)
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version to build (for example, 0.1.0)
        required: true
        type: string
      prerelease:
        description: Pre-release build (does not move the "latest" tag)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: osprey-addon

jobs:
  prepare:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.value }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          raw_version="${INPUT_VERSION:-}"
          version="${raw_version#v}"
          if [ -z "$version" ]; then
            echo 'A release tag or workflow_dispatch version is required' >&2
            exit 1
          fi
          case "$version" in
            *[!A-Za-z0-9._+-]*) echo "Invalid image version: $raw_version" >&2; exit 1 ;;
          esac
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version must be semver-like: $raw_version" >&2; exit 1 ;;
          esac
          # The manifest version must match the release version.  The awk
          # program deliberately avoids quote characters: a shell expression
          # that embeds them is easy to mangle into a different regular
          # expression than the one it looks like.
          manifest_version="$(awk -F: '/^version:/ {gsub(/[^0-9A-Za-z.+-]/, "", $2); print $2; exit}' homeassistant/addon/osprey/config.yaml)"
          if [ "$manifest_version" != "$version" ]; then
            echo "Home Assistant manifest version ($manifest_version) must match release version ($version)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # "latest" only moves on a final release, so a pre-release never
          # becomes the add-on that an existing installation pulls.
          {
            echo 'tags<<OSPREY_TAGS_EOF'
            echo "$version"
            if [ "${INPUT_PRERELEASE:-false}" != "true" ]; then
              echo 'latest'
            fi
            echo 'OSPREY_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: .
          file: homeassistant/addon/osprey/Dockerfile
          image: ${{ matrix.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.prepare.outputs.tags }}
          push: 'true'
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.prepare.outputs.tags }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
