# git-cliff configuration: Conventional Commit titles become the changelog and
# the GitHub release notes. Both come from this file, so they cannot drift.
#
#   git-cliff --unreleased --tag vX.Y.Z                          # preview the next section
#   git-cliff --tag vX.Y.Z --unreleased --prepend CHANGELOG.md   # before tagging
#   CLIFF_NOTES=1 git-cliff --latest --strip header              # the release body for a tag
#
# The release workflow runs the last command. CLIFF_NOTES=1 leaves out the
# version heading, because the release already has that title.
#
# git-cliff is pinned in requirements-ci.txt.

[changelog]
header = """
# Changelog

Every release of Osprey, newest first. Each section is generated from the
Conventional Commit titles merged for that release, and it is also the body
of the GitHub release. See cliff.toml and CONTRIBUTING.md. The sections for
0.9.0b1 to 0.9.0b3 were written by hand, before the notes came from git-cliff.

"""
body = """
{% if get_env(name="CLIFF_NOTES", default="") != "1" %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope and commit.scope != "security" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
{% if version and previous.version %}
Full list of changes: [{{ previous.version }}...{{ version }}](https://github.com/grayslawson/osprey/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_preprocessors = [
  # Link pull request numbers that squash merges append to the title.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/grayslawson/osprey/pull/${1}))" },
]
# The first matching parser wins. The numbered comments only fix the order of
# the groups in the output.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^(chore|ci|test|style|refactor|wip)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^build\\(deps", skip = true },
  { message = "^docs\\(changelog\\)", skip = true },
  { field = "scope", pattern = "^security$", group = "<!-- 1 -->Security" },
  { message = "^(sec|security)", group = "<!-- 1 -->Security" },
  { message = "^feat", group = "<!-- 2 -->Features" },
  { message = "^fix", group = "<!-- 3 -->Fixes" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^docs", group = "<!-- 5 -->Docs" },
  { message = "^(build|packaging)", group = "<!-- 6 -->Packaging" },
]
