# git-cliff configuration: Conventional Commits -> CHANGELOG.md and release notes.
#
#   git-cliff --unreleased --prepend CHANGELOG.md   # before tagging
#   git-cliff --latest --strip header                # release notes for a tag
#
# Installed in CI at the version pinned in requirements-ci.txt.

[changelog]
header = """
# Changelog

All notable changes to Osprey are listed here. Entries are generated from
Conventional Commit subjects by git-cliff (see cliff.toml).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^(sec|security)", group = "Security" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|packaging)", group = "Packaging" },
  { message = "^(chore|ci|test|style|refactor|wip)", skip = true },
]
